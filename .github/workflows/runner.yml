# Temporary diagnosis branch: never merge. Which runner unit test files are
# slow on GitHub's Mac runners (the Mac jobs time out at 30 minutes).
name: Runner, Convex and website tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runner/package-lock.json
      - name: Image tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick librsvg2-bin
      - name: Packages
        run: |
          node --version
          npm ci --no-audit --no-fund
          (cd runner && npm ci --no-audit --no-fund)
      - name: The machine
        run: |
          node -e 'const os = require("os"); console.log(os.availableParallelism(), "cores", os.cpus()[0].model, Math.round(os.totalmem() / 2 ** 30), "GB")'
          command -v bash git cargo rustc swift npm || true
          bash --version | head -1
          time node -e 0
          time npm --version
          time git --version
      - name: check-cache.test.ts alone
        working-directory: runner
        env:
          THREADBEAR_CLI_UPDATES: 'off'
          THREADBEAR_SYNC: 'off'
          THREADBEAR_JOB_PRIORITY: normal
        run: time node --import=./test/helpers/clean-env.ts --test --test-timeout=300000 --test-force-exit --test-reporter=spec test/unit/check-cache.test.ts
      - name: Every unit test file, with when each started and how long it took
        if: always()
        working-directory: runner
        env:
          THREADBEAR_CLI_UPDATES: 'off'
          THREADBEAR_SYNC: 'off'
          THREADBEAR_JOB_PRIORITY: normal
        run: time node --import=./test/helpers/clean-env.ts --test --test-timeout=300000 --test-force-exit --test-reporter=./test/helpers/diag-reporter.mjs --test-reporter-destination=stdout 'test/unit/**/*.test.ts'
